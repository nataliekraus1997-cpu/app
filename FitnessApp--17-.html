// (not part of the main EXERCISE_LIBRARY equipment map above). The "(Band)" moves use
// resistance bands ("Gummibänder") to closely mimic the original movement's resistance
// profile, so they're preferred over jumping straight to a bodyweight move. All the
// pure-bodyweight fallbacks below need no equipment at all.
const FALLBACK_EQUIPMENT = {
  "Liegestütze": [],

};

function equipmentFor(exercise) {
  return EXERCISE_REQUIRED_EQUIPMENT[exercise] ?? FALLBACK_EQUIPMENT[exercise] ?? [];
}

// Collects every exercise in the equipment-substitution chain (starting with the
// exercise itself) that is actually doable with the given equipment, in chain
// order (closest substitute first). This lets a duplicate pick fall through to
// the *next* valid alternative in its own chain — instead of only the one leaf
// node that another exercise already collided into.
function collectEquipmentValidCandidates(exercise, equipment, _visited = new Set(), _out = []) {
  if (_visited.has(exercise)) return _out;
  _visited.add(exercise);
  const required = equipmentFor(exercise);
  if (required.every((e) => equipment.includes(e))) _out.push(exercise);
  const chain = EXERCISE_ALTERNATIVES[exercise] || [];
  for (const alt of chain) collectEquipmentValidCandidates(alt, equipment, _visited, _out);
  return _out;
}

// Resolves a single exercise to the best equipment-valid option (used outside of
// full-plan resolution, e.g. previews). Equivalent to the first candidate found by
// collectEquipmentValidCandidates.
function resolveExerciseForEquipment(exercise, equipment) {
  const candidates = collectEquipmentValidCandidates(exercise, equipment);
  const name = candidates[0] || "Plank";
  return { name, substituted: name !== exercise, original: exercise };
}

// Applies equipment-aware substitution to every exercise in a plan. Each exercise
// in the plan is guaranteed to appear at most once in the final list whenever a
// distinct, equipment-valid alternative exists anywhere in its own substitution
// chain: instead of stopping at the first valid match (which can make several
// different exercises collapse onto the same generic bodyweight move, e.g. three
// "Liegestütze" on Push Day), every planned exercise walks its *entire* chain and
// picks the first candidate not already used today.
function resolvePlanForEquipment(plan, equipment) {
  if (!plan) return plan;
  const usedToday = new Set();
  const resolved = plan.exercises.map((ex) => {
    const candidates = collectEquipmentValidCandidates(ex, equipment);
    let name = candidates.find((c) => !usedToday.has(c));
    // If every valid candidate in the chain is already used today, keep the
    // duplicate rather than dropping the exercise — better a repeat than a
    // missing movement.
    if (!name) name = candidates[0] || "Plank";
    usedToday.add(name);
    return { name, substituted: name !== ex, original: ex };
  });
  return {
    ...plan,
    exercises: resolved.map((r) => r.name),
    substitutions: resolved.filter((r) => r.substituted),
  };
}

// Generates a plausible, category-aware preparation method for a recipe that only has
// structured nutrient/ingredient data (no free-text instructions authored for it). Uses
// the recipe's own ingredient list and category so the steps are always specific to that
// dish rather than a generic placeholder, and is fully deterministic (same recipe always
// yields the same steps).
const CATEGORY_PREP_TEMPLATES = {
  fruehstueck: (ings) => [
    `${ings[0]} vorbereiten: waschen, schälen bzw. abmessen, je nach Zutat.`,
    `${ings.slice(1).join(" und ")} klein schneiden oder abwiegen und bereitstellen.`,
    `Alle Zutaten in einer Schüssel bzw. Pfanne vermengen oder kurz erhitzen, bis alles gut kombiniert ist.`,
    `Anrichten und bei Bedarf mit etwas Flüssigkeit (Wasser, Milch, Pflanzenmilch) abschmecken.`,
  ],
  hauptspeise: (ings) => [
    `${ings[0]} vorbereiten und in mundgerechte Stücke schneiden.`,
    `${ings.slice(1).join(" und ")} waschen, schneiden und griffbereit hinstellen.`,
    `In einer Pfanne oder einem Topf mit etwas Öl anbraten bzw. köcheln lassen, bis alles gar ist.`,
    `Mit Salz, Pfeffer und Gewürzen nach Geschmack abschmecken und heiß servieren.`,
  ],
  salat: (ings) => [
    `${ings[0]} waschen und klein schneiden oder in Scheiben hobeln.`,
    `${ings.slice(1).join(" und ")} vorbereiten und dazugeben.`,
    `Alle Zutaten in einer großen Schüssel vermengen.`,
    `Mit einem Dressing nach Wahl (z. B. Öl, Essig, Zitrone, Gewürze) abschmecken und servieren.`,
  ],
  suppe: (ings) => [
    `${ings[0]} vorbereiten und klein schneiden.`,
    `${ings.slice(1).join(" und ")} ebenfalls vorbereiten und in einen Topf geben.`,
    `Mit Brühe aufgießen und bei mittlerer Hitze köcheln lassen, bis alle Zutaten gar sind.`,
    `Nach Belieben pürieren oder stückig lassen, abschmecken und servieren.`,
  ],
  snack: (ings) => [
    `${ings[0]} bereitstellen bzw. vorbereiten.`,
    `${ings.slice(1).join(" und ")} dazugeben oder unterrühren.`,
    `Alles gut vermengen bzw. kurz anrösten, je nach Zutaten.`,
    `Direkt genießen oder für später kühl aufbewahren.`,
  ],
  nachspeise: (ings) => [
    `${ings[0]} vorbereiten und ggf. klein schneiden.`,
    `${ings.slice(1).join(" und ")} dazugeben und vermengen.`,
    `Bei Bedarf kurz erwärmen oder kalt anrichten, je nach Rezept.`,
    `Vor dem Servieren kurz ziehen lassen oder direkt genießen.`,
  ],
};

function prepStepsFor(recipe) {
  const template = CATEGORY_PREP_TEMPLATES[recipe.category] || CATEGORY_PREP_TEMPLATES.hauptspeise;
  return template(recipe.ingredients);
}

function suggestRecipes(remainingKcal, goal, likedIngredients, dislikedIngredients, count = 8, category = "alle") {
  // Hard-exclude recipes containing a disliked ingredient, and filter by category if set.
  const candidates = RECIPES.filter(
    (r) =>
      !r.ingredients.some((ing) => dislikedIngredients.includes(ing)) &&
      (category === "alle" || r.category === category)
  );
  // Score each recipe: fits budget (closer to but not exceeding remaining = better),
  // matches goal, rewards fiber/protein/vitamin density, and boosts liked ingredients.
  const scored = candidates.map((r) => {
    let score = 0;
    if (r.goals.includes(goal)) score += 40;
    const fits = remainingKcal > 0 ? r.kcal <= remainingKcal + 150 : true;
    if (fits) score += 30;
    const overshoot = remainingKcal > 0 ? Math.max(0, r.kcal - remainingKcal) : 0;
    score -= overshoot * 0.05;
    score += r.fiber * 1.2;
    score += r.protein * 0.4;
    score += r.vitamins.length * 3;
    const likedMatches = r.ingredients.filter((ing) => likedIngredients.includes(ing)).length;
    score += likedMatches * 15;
    return { ...r, score };
  });
  return scored.sort((a, b) => b.score - a.score).slice(0, count);
}

function todayLabel() {
  return new Date().toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" });
}

// ISO date key (YYYY-MM-DD) used to group/attribute entries to a specific calendar day,
// independent of the human-readable label shown in the UI. Defaults to today.
function isoDate(d = new Date()) {
  const yy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${yy}-${mm}-${dd}`;
}

// Human-readable label for a given ISO date key, e.g. "Mo., 03.08.".
function labelForDateKey(key) {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" });
}

function addDaysToKey(key, delta) {
  const [y, m, d] = key.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + delta);
  return isoDate(dt);
}

function uid() {
  return Math.random().toString(36).slice(2, 10);
}

];

const GOAL_ADJUSTMENT = {
  abnehmen: -450,
  zunehmen: 400,
  definieren: -200,
};

function calcDailyCalorieTarget({ gender, age, heightCm, weightKg, activityLevel, goal }) {
  const base = 10 * weightKg + 6.25 * heightCm - 5 * age;
  const bmr = gender === "weiblich" ? base - 161 : base + 5;
  const activityFactor = ACTIVITY_LEVELS.find((a) => a.id === activityLevel)?.factor ?? 1.375;
  const tdee = bmr * activityFactor;
  const target = tdee + (GOAL_ADJUSTMENT[goal] ?? 0);
  return { bmr: Math.round(bmr), tdee: Math.round(tdee), target: Math.round(target) };
}

// Rotating weekly training-stimulus emphasis so the supplement suggestion doesn't
// look identical every day even when the strength plan or goal stays the same.
// Independent of the push/pull/legs split — this varies which *type* of
// supplementary stimulus (cardio, strength, mobility, or a mix) is favored on a
// given weekday, so e.g. two Push days in the same week (Mo/Do) still get a
// different supplementary emphasis. Index 0 = Sonntag, matching WEEKLY_SCHEDULE.
const DAILY_STIMULUS_FOCUS = [
  "Mobilität",      // Sonntag — aktive Erholung
  "Cardio",         // Montag
  "Mobilität",      // Dienstag
  "Cardio & Kraft", // Mittwoch
  "Kraft",          // Donnerstag
  "Cardio",         // Freitag
  "Cardio & Kraft", // Samstag
];

// Per-goal bias for *which type* of supplementary stimulus makes sense:
// - Abnehmen: extra kcal-burn is the whole point, so cardio (and cardio-heavy combos)
//   is favored and allowed to fill closer to the full extra-burn target.
// - Zunehmen: the extra-burn target should be met with the least interference to a
//   caloric surplus/recovery, so strength work is favored over pure cardio, and the
//   engine deliberately doesn't try to fully exhaust the kcal target with cardio.
// - Definieren: a balanced mix of cardio and strength, matching the type as scored.
const GOAL_TYPE_BIAS = {
  abnehmen: { "Cardio": 26, "Cardio & Kraft": 20, "Kraft": 4, "Mobilität": 0 },
  zunehmen: { "Kraft": 26, "Cardio & Kraft": 10, "Mobilität": 8, "Cardio": -8 },
  definieren: { "Cardio & Kraft": 22, "Kraft": 16, "Cardio": 14, "Mobilität": 6 },
};

// How much of the remaining extra-burn target this goal actually wants to chase with
// supplementary training. Abnehmen chases it fully; Zunehmen intentionally caps it lower
// so the exercise selection doesn't over-index on high-kcal cardio picks.
const GOAL_BURN_CHASE_FACTOR = {
  abnehmen: 1,
  zunehmen: 0.55,
  definieren: 0.8,
};

// Rule-based stand-in for an AI call: suggests supplementary training based on what has
// already been done today (from Health Connect / planned workout), the day's strength plan,
// the user's goal, the equipment actually available at home, the user's own extra-burn
// target, and a rotating weekly stimulus focus so suggestions vary across the week instead
// of always favoring the same training type. The goal changes both which exercise *types*
// are favored (e.g. Zunehmen leans strength, Abnehmen leans cardio) and how aggressively
// the extra-burn target itself is chased.
function suggestTrainingSupplement({ burnedSoFar, targetBurn, equipment, goal, hasStrengthPlanToday, dayFocus }) {
  const chaseFactor = GOAL_BURN_CHASE_FACTOR[goal] ?? 1;
  const effectiveTarget = targetBurn * chaseFactor;
  const remaining = effectiveTarget - burnedSoFar;
  const available = EXERCISE_SUPPLEMENTS.filter((s) => s.equipment.every((e) => equipment.includes(e)));
  const typeBias = GOAL_TYPE_BIAS[goal] || {};

  if (remaining <= 50) {
    // Enough done already — recommend recovery only.
    return available
      .filter((s) => s.type === "Mobilität")
      .slice(0, 1)
      .map((s) => ({ ...s, reason: "Tagesziel bereits erreicht — nur aktive Erholung empfohlen." }));
  }

  const scored = available.map((s) => {
    let score = 0;
    if (s.goals.includes(goal)) score += 15;
    score += typeBias[s.type] || 0; // goal-specific preference for the exercise's training type
    const overshoot = Math.max(0, s.kcal - remaining);
    score -= overshoot * 0.1;
    score += Math.min(s.kcal, remaining) * 0.15;
    if (hasStrengthPlanToday && s.type === "Cardio") score += 10; // balance strength day with light cardio
    if (!hasStrengthPlanToday && s.type === "Kraft") score += 10; // balance rest/cardio day with strength
    if (dayFocus && s.type === dayFocus) score += 20; // rotating weekly stimulus emphasis
    return { ...s, score };
  });

  return scored
    .sort((a, b) => b.score - a.score)
    .slice(0, 2)
    .map((s) => ({ ...s, reason: `Füllt ${Math.min(s.kcal, remaining)} kcal deines Extra-Ziels (${goal}-optimiert) von ${remaining} kcal Restpensum.` }));
}

// Goal-specific training-scheme adjustments: the same exercise is coached differently
// depending on what the user actually wants to achieve — more reps & shorter rest for
// a metabolic, calorie-burning stimulus (Abnehmen), fewer reps with more rest so each
// set can be pushed harder for hypertrophy/strength (Zunehmen), and the original
// moderate scheme in between (Definieren). Only "reps" and "hold" type exercises are
// adjusted; "duration" exercises (e.g. Laufen) are goal-agnostic.
const GOAL_TRAINING_ADJUST = {
  abnehmen: { repsMultiplier: 1.5, holdMultiplier: 1.3, restMultiplier: 0.7, setsDelta: 0 },
  zunehmen: { repsMultiplier: 0.75, holdMultiplier: 0.8, restMultiplier: 1.3, setsDelta: 1 },
  definieren: { repsMultiplier: 1, holdMultiplier: 1, restMultiplier: 1, setsDelta: 0 },
};

function guideFor(name, goal = "definieren") {
  const base = EXERCISE_GUIDE[name] || DEFAULT_EXERCISE_GUIDE;
  const adj = GOAL_TRAINING_ADJUST[goal] || GOAL_TRAINING_ADJUST.definieren;
  if (base.type === "reps") {
    return {
      ...base,
      reps: Math.max(4, Math.round(base.reps * adj.repsMultiplier)),
      sets: Math.max(2, base.sets + adj.setsDelta),
      restSec: Math.max(30, Math.round(base.restSec * adj.restMultiplier)),
    };
  }
  if (base.type === "hold") {
    return {
      ...base,
      holdSec: Math.max(15, Math.round(base.holdSec * adj.holdMultiplier)),
      sets: Math.max(2, base.sets + adj.setsDelta),
      restSec: Math.max(20, Math.round(base.restSec * adj.restMultiplier)),
    };
  }
  return base; // duration-type exercises (e.g. Laufen) stay goal-agnostic
}

function ExerciseDetailModal({ name, onClose, goal = "definieren" }) {
  const guide = guideFor(name, goal);
  const [currentSet, setCurrentSet] = useState(1);
  const [phase, setPhase] = useState("idle"); // idle | working | resting | done
  const [elapsed, setElapsed] = useState(0); // seconds, counts up while working, down while resting

  React.useEffect(() => {
    if (phase === "idle" || phase === "done") return;
    const t = setInterval(() => {
      setElapsed((prev) => {
        if (phase === "working") return prev + 1;
        // resting: count down
        if (prev <= 1) {
          clearInterval(t);
          if (currentSet >= guide.sets) {
            setPhase("done");
          } else {
            setCurrentSet((c) => c + 1);
            setPhase("idle");
          }
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(t);
  }, [phase, currentSet, guide.sets]);

  const startSet = () => {
    setElapsed(0);
    setPhase("working");
  };
  const finishSet = () => {
    setElapsed(guide.restSec);
    setPhase("resting");
  };
  const skipRest = () => {
    if (currentSet >= guide.sets) {
      setPhase("done");
    } else {
      setCurrentSet((c) => c + 1);
      setPhase("idle");
    }
    setElapsed(0);
  };
  const restart = () => {
    setCurrentSet(1);
    setPhase("idle");
    setElapsed(0);
  };

  const formatTime = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  const targetLabel =
    guide.type === "hold" ? `${guide.holdSec}s halten` :
    guide.type === "duration" ? `${Math.round(guide.holdSec / 60)} min` :
    `${guide.reps} Wdh.`;

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(11,26,46,0.85)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 60 }} onClick={onClose}>
      <div
        onClick={(e) => e.stopPropagation()}
        style={{ background: COLORS.card, borderRadius: "18px 18px 0 0", border: `1px solid ${COLORS.line}`, borderBottom: "none", padding: 22, width: "100%", maxWidth: 440, maxHeight: "88vh", overflowY: "auto" }}
      >
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
          <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
            <ExercisePictogram name={name} size={48} />
            <div>
              <div style={{ fontWeight: 700, fontSize: 17 }}>{name}</div>
              <div style={{ fontSize: 11, color: COLORS.steel, marginTop: 2 }}>{guide.muscle}</div>
            </div>
          </div>
          <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer" }}>
            <Icon name="close" size={18} color={COLORS.steel} />
          </button>
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
          <div style={{ flex: 1, background: COLORS.ink, borderRadius: 10, padding: "10px 12px", textAlign: "center", border: `1px solid ${COLORS.line}` }}>
            <div className="mono" style={{ fontSize: 16, fontWeight: 700, color: COLORS.signal }}>{guide.sets}</div>
            <div style={{ fontSize: 9, color: COLORS.steel }}>SÄTZE</div>
          </div>
          <div style={{ flex: 1, background: COLORS.ink, borderRadius: 10, padding: "10px 12px", textAlign: "center", border: `1px solid ${COLORS.line}` }}>
            <div className="mono" style={{ fontSize: 16, fontWeight: 700, color: COLORS.signal }}>{targetLabel}</div>
            <div style={{ fontSize: 9, color: COLORS.steel }}>{guide.type === "reps" ? "PRO SATZ" : "ZIEL"}</div>
          </div>
          <div style={{ flex: 1, background: COLORS.ink, borderRadius: 10, padding: "10px 12px", textAlign: "center", border: `1px solid ${COLORS.line}` }}>
            <div className="mono" style={{ fontSize: 16, fontWeight: 700, color: COLORS.ember }}>{guide.restSec}s</div>
            <div style={{ fontSize: 9, color: COLORS.steel }}>PAUSE</div>
          </div>
        </div>

        <div style={{ fontSize: 12, color: COLORS.steel, fontWeight: 600, marginBottom: 8 }}>ANLEITUNG</div>
        <ol style={{ margin: 0, marginBottom: 18, paddingLeft: 18, display: "flex", flexDirection: "column", gap: 6 }}>
          {guide.steps.map((step, i) => (
            <li key={i} style={{ fontSize: 12.5, color: COLORS.chalk, lineHeight: 1.5 }}>{step}</li>
          ))}
        </ol>

        {/* Timer */}
        <div style={{ background: COLORS.ink, borderRadius: 14, padding: 18, border: `1px solid ${COLORS.line}`, textAlign: "center" }}>
          {phase === "done" ? (
            <>
              <Icon name="trophy" size={28} color={COLORS.signal} />
              <div style={{ fontWeight: 700, fontSize: 16, marginTop: 8 }}>Alle {guide.sets} Sätze geschafft!</div>
              <button
                onClick={restart}
                style={{ marginTop: 12, padding: "10px 16px", borderRadius: 8, border: `1px solid ${COLORS.line}`, background: "transparent", color: COLORS.steel, fontSize: 12, fontWeight: 600, cursor: "pointer" }}

                Nochmal von vorne
              </button>
            </>
          ) : (
            <>
              <div style={{ fontSize: 11, color: COLORS.steel, fontWeight: 600, marginBottom: 6 }}>
                SATZ {currentSet} / {guide.sets}
                {phase === "resting" && " · PAUSE"}
                {phase === "working" && " · AUSFÜHRUNG"}
              </div>
              <div className="mono" style={{ fontSize: 40, fontWeight: 700, color: phase === "resting" ? COLORS.ember : COLORS.signal, lineHeight: 1 }}>
                {formatTime(elapsed)}

              <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
                {phase === "idle" && (

                    onClick={startSet}
                    style={{ flex: 1, padding: "12px", borderRadius: 8, border: "none", background: COLORS.signal, color: COLORS.ink, fontWeight: 700, fontSize: 14, cursor: "pointer" }}

                    Satz starten

                )}
                {phase === "working" && (
                  <button
                    onClick={finishSet}
                    style={{ flex: 1, padding: "12px", borderRadius: 8, border: "none", background: COLORS.ember, color: COLORS.ink, fontWeight: 700, fontSize: 14, cursor: "pointer" }}
                  >
                    Satz beenden → Pause starten
                  </button>
                )}
                {phase === "resting" && (
                  <button
                    onClick={skipRest}
                    style={{ flex: 1, padding: "12px", borderRadius: 8, border: `1px solid ${COLORS.line}`, background: "transparent", color: COLORS.chalk, fontWeight: 600, fontSize: 13, cursor: "pointer" }}
                  >
                    Pause überspringen
                  </button>
                )}
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}


function LineChartSimple({ data, color }) {
  if (!data || data.length === 0) return null;
  const w = 300, h = 160, pad = 24;
  const ys = data.map((d) => d.y);
  const min = Math.min(...ys), max = Math.max(...ys);
  const range = max - min || 1;
  const stepX = (w - pad * 2) / Math.max(1, data.length - 1);
  const points = data.map((d, i) => {
    const x = pad + i * stepX;
    const y = h - pad - ((d.y - min) / range) * (h - pad * 2);
    return { x, y, label: d.x, value: d.y };
  });
  const pathD = points.map((p, i) => `${i === 0 ? "M" : "L"}${p.x},${p.y}`).join(" ");
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="xMidYMid meet">
      {[0, 1, 2, 3].map((i) => (
        <line key={i} x1={pad} x2={w - pad} y1={pad + (i * (h - pad * 2)) / 3} y2={pad + (i * (h - pad * 2)) / 3} stroke={COLORS.line} strokeWidth="1" />
      ))}
      <path d={pathD} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
      {points.map((p, i) => (
        <g key={i}>
          <circle cx={p.x} cy={p.y} r="4" fill={color} />
          <text x={p.x} y={h - 4} fontSize="9" fill={COLORS.steel} textAnchor="middle">{p.label}</text>
        </g>
      ))}
    </svg>
  );
}

// ---------- Simple inline SVG bar chart (no external deps) ----------
function BarChartSimple({ data, color }) {
  if (!data || data.length === 0) return null;
  const w = 300, h = 160, pad = 24;
  const max = Math.max(...data.map((d) => d.y), 1);
  const barW = (w - pad * 2) / data.length;
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="xMidYMid meet">
      {[0, 1, 2, 3].map((i) => (
        <line key={i} x1={pad} x2={w - pad} y1={pad + (i * (h - pad * 2)) / 3} y2={pad + (i * (h - pad * 2)) / 3} stroke={COLORS.line} strokeWidth="1" />
      ))}
      {data.map((d, i) => {
        const barH = (d.y / max) * (h - pad * 2 - 14);
        const x = pad + i * barW + barW * 0.15;
        const y = h - pad - barH - 14;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barW * 0.7} height={barH} rx="3" fill={color} />
            <text x={x + barW * 0.35} y={h - 4} fontSize="9" fill={COLORS.steel} textAnchor="middle">{d.x}</text>
          </g>
        );
      })}
    </svg>
  );
}

// ---------- Persistent storage (localStorage) ----------
// Every piece of app data the user creates (profile, logs, meals, weight log,
// equipment, goal, ...) is mirrored into localStorage under this prefix, so it
// survives closing the tab/browser and reopening the app later -- instead of
// living only in React state and disappearing the moment the page is closed.
const STORAGE_PREFIX = "replog:";

function loadPersisted(key, fallback) {
  try {
    const raw = window.localStorage.getItem(STORAGE_PREFIX + key);
    if (raw == null) return fallback;
    return JSON.parse(raw);
  } catch (e) {
    return fallback;
  }
}

// Drop-in replacement for useState that also reads its initial value from
// localStorage (if present) and writes every update back to localStorage,
// keyed under STORAGE_PREFIX + key. Usage is identical to useState otherwise.
function usePersistentState(key, initialValue) {
  const [value, setValue] = useState(() => loadPersisted(key, initialValue));
  useEffect(() => {
    try {
      window.localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
    } catch (e) {
      // Storage full or unavailable (e.g. private browsing) -- fail silently,
      // the app still works for the current session.
    }
  }, [key, value]);
  return [value, setValue];
}

  const [goal, setGoal] = usePersistentState("goal", "definieren");
  const [likedIngredients, setLikedIngredients] = usePersistentState("likedIngredients", []);
  const [dislikedIngredients, setDislikedIngredients] = usePersistentState("dislikedIngredients", []);
  const [showPrefs, setShowPrefs] = useState(false);
  const [recipeCategory, setRecipeCategory] = useState("alle");

  const [form, setForm] = useState({ exercise: EXERCISE_LIBRARY[0], weight: "", reps: "", sets: "" });

  // Nutrition: custom food database (built-ins + user-added foods via barcode/photo).
  const [foodDatabase, setFoodDatabase] = usePersistentState("foodDatabase", FOOD_DATABASE);
  const [foodSearch, setFoodSearch] = useState("");
  const [selectedFood, setSelectedFood] = useState(null);
  const [logAmount, setLogAmount] = useState("100");
  const [showAiScan, setShowAiScan] = useState(false); // photo of a meal -> AI recognition
  const [showLabelScan, setShowLabelScan] = useState(false); // photo of a nutrition label -> new food
  const [showBarcodeScan, setShowBarcodeScan] = useState(false); // barcode -> lookup or create

  // Calorie-need questionnaire: shown on first use, repeatable from Settings.
  const [profile, setProfile] = usePersistentState("profile", null); // { gender, age, heightCm, weightKg, activityLevel, goal }
  const [kcalGoal, setKcalGoal] = usePersistentState("kcalGoal", 2200); // fallback default until questionnaire is completed
  // Only show the questionnaire on true first use -- once a profile is persisted,
  // don't force it again on every reload.
  const [showQuestionnaire, setShowQuestionnaire] = useState(() => loadPersisted("profile", null) === null);

  // Body-composition log: weight + muscle/fat/water/bone percentages over time.
  // Blanko-Start: keine Beispieldaten — füllt sich erst durch eigene Einträge.
  const [weightLog, setWeightLog] = usePersistentState("weightLog", []); // [{ id, date, weightKg, musclePct, fatPct, waterPct, bonePct }]

  // Selected day in the Tagebuch (diary) view — defaults to today, never past "today".
  const [diaryDateKey, setDiaryDateKey] = useState(isoDate());

  const addWeightEntry = (entry, dateKey = isoDate()) => {
    setWeightLog((wl) => [
      ...wl,
      { id: uid(), date: labelForDateKey(dateKey), dateKey, ...entry },
    ]);
  };
  const removeWeightEntry = (id) => setWeightLog((wl) => wl.filter((w) => w.id !== id));
  const updateWeightEntry = (id, patch) =>
    setWeightLog((wl) => wl.map((w) => (w.id === id ? { ...w, ...patch } : w)));

  // Health Connect (mocked): connection status + equipment available at home.
  const [healthConnected, setHealthConnected] = usePersistentState("healthConnected", false);
  const [healthSource, setHealthSource] = usePersistentState("healthSource", HEALTH_CONNECT_SOURCES[0]);
  const [equipment, setEquipment] = usePersistentState("equipment", []);
  // User-configurable extra activity-burn target: how many kcal beyond the daily
  // nutrition pensum she wants the KI-Trainingsergänzung to aim to burn through
  // supplementary training. Editable in Einstellungen; defaults to a moderate 500 kcal.
  const [extraBurnTarget, setExtraBurnTarget] = usePersistentState("extraBurnTarget", 500);

  const completeQuestionnaire = (answers) => {
    const result = calcDailyCalorieTarget(answers);
    setProfile(answers);
    setKcalGoal(result.target);
    setGoal(answers.goal);
    setShowQuestionnaire(false);
  };

  const addLog = (dateKey = isoDate()) => {
    if (!form.weight || !form.reps || !form.sets) return;
    setLogs([
      ...logs,
      {
        id: uid(),
        date: labelForDateKey(dateKey),
        dateKey,
        exercise: form.exercise,
        weight: Number(form.weight),
        reps: Number(form.reps),
        sets: Number(form.sets),
      },
    ]);
    setForm({ ...form, weight: "", reps: "", sets: "" });
  };

  const removeLog = (id) => setLogs(logs.filter((l) => l.id !== id));
  const updateLog = (id, patch) => setLogs((ls) => ls.map((l) => (l.id === id ? { ...l, ...patch } : l)));

  const addMeal = (dateKey = isoDate()) => {
    if (!selectedFood || !logAmount || Number(logAmount) <= 0) return;
    const scaled = scaleFood(selectedFood, Number(logAmount));
    setMeals([
      ...meals,
      {
        id: uid(),
        day: dateKey === isoDate() ? "Heute" : labelForDateKey(dateKey),
        dateKey,
        foodId: selectedFood.id,
        name: selectedFood.name,
        amount: scaled.amount,
        unit: selectedFood.unit,
        kcal: scaled.kcal,
        protein: scaled.protein,
        carbs: scaled.carbs,
        sugar: scaled.sugar,
        fat: scaled.fat,
        satFat: scaled.satFat,
        fiber: scaled.fiber,
        salt: scaled.salt,
      },
    ]);
    setSelectedFood(null);
    setFoodSearch("");
    setLogAmount("100");
  };

  const removeMeal = (id) => setMeals(meals.filter((m) => m.id !== id));
  const updateMeal = (id, patch) => setMeals((ms) => ms.map((m) => (m.id === id ? { ...m, ...patch } : m)));

  // Adds a brand-new food to the local database (from a scanned barcode or a
  // photographed nutrition label) so it can be found and logged from now on.
  const addCustomFood = (food) => {
    const newFood = { id: uid(), unit: food.unit || "g", barcode: food.barcode || null, vitamins: food.vitamins || [], ...food };
    setFoodDatabase((db) => [...db, newFood]);
    return newFood;
  };

  // Simulated AI photo recognition: stands in for a real vision-model call that
  // would identify the dish and estimate/match a recipe with its nutrient values.
  const recognizeMealPhoto = () => {
    const guess = RECIPES[Math.floor(Math.random() * RECIPES.length)];
    return {
      name: guess.name,
      kcal: guess.kcal,
      protein: guess.protein,
      fiber: guess.fiber,
      confidence: 0.7 + Math.random() * 0.25,
      matchedRecipe: guess,
    };
  };

  // Simulated nutrition-label OCR: stands in for a real vision-model call that
  // would read the printed table and pre-fill the values for a new food.
  const recognizeNutritionLabel = () => ({
    kcal: 250 + Math.floor(Math.random() * 200),
    protein: Math.round((5 + Math.random() * 20) * 10) / 10,
    carbs: Math.round((5 + Math.random() * 40) * 10) / 10,
    sugar: Math.round((1 + Math.random() * 15) * 10) / 10,
    fat: Math.round((1 + Math.random() * 20) * 10) / 10,
    satFat: Math.round((0.5 + Math.random() * 8) * 10) / 10,
    fiber: Math.round((0.5 + Math.random() * 8) * 10) / 10,
    salt: Math.round((0.1 + Math.random() * 1.5) * 10) / 10,
  });


  const todaysMeals = meals.filter((m) => (m.dateKey ?? isoDate()) === isoDate());
  const todaysKcal = todaysMeals.reduce((s, m) => s + m.kcal, 0);
  const kcalPct = Math.min(100, Math.round((todaysKcal / kcalGoal) * 100));

  const progressData = useMemo(() => {
    const byExercise = {};
    logs.forEach((l) => {
      if (!byExercise[l.exercise]) byExercise[l.exercise] = [];
      byExercise[l.exercise].push(l);
    });
    const first = Object.keys(byExercise)[0];
    return first ? byExercise[first].map((l) => ({ x: l.date, y: l.weight })) : [];
  }, [logs]);

  const setsPerExercise = useMemo(() => {
    return Object.values(
      logs.reduce((acc, l) => {
        acc[l.exercise] = acc[l.exercise] || { x: l.exercise, y: 0 };
        acc[l.exercise].y += l.sets;
        return acc;
      }, {})
    );
  }, [logs]);

  const totalVolume = logs.reduce((s, l) => s + l.weight * l.reps * l.sets, 0);

  // Real streak: counts consecutive days (ending today) that have at least one
  // logged set, meal, or weight entry — no more illustrative placeholder value.
  const streak = useMemo(() => {
    const activeDays = new Set([
      ...logs.map((l) => l.dateKey || isoDate()),
      ...meals.map((m) => m.dateKey || isoDate()),
      ...weightLog.map((w) => w.dateKey || isoDate()),
    ]);
    let count = 0;
    let cursor = isoDate();
    while (activeDays.has(cursor)) {
      count += 1;
      cursor = addDaysToKey(cursor, -1);
    }
    return count;
  }, [logs, meals, weightLog]);

  const todayIndex = new Date().getDay(); // 0 = Sonntag
  const todayPlanId = WEEKLY_SCHEDULE[todayIndex];
  const rawTodayPlan = PLANS.find((p) => p.id === todayPlanId) || null;
  const todayPlan = useMemo(() => resolvePlanForEquipment(rawTodayPlan, equipment), [rawTodayPlan, equipment]);

  const remainingKcal = kcalGoal - todaysKcal;
  const suggestions = useMemo(
    () => suggestRecipes(remainingKcal, goal, likedIngredients, dislikedIngredients, 8, recipeCategory),
    [remainingKcal, goal, likedIngredients, dislikedIngredients, recipeCategory]
  );

  const tabs = [
    { id: "home", label: "Heute", icon: "home" },
    { id: "log", label: "Protokoll", icon: "dumbbell" },
    { id: "training", label: "Training", icon: "activity" },
    { id: "plans", label: "Pläne", icon: "calendar" },
    { id: "progress", label: "Fortschritt", icon: "trending" },
    { id: "diary", label: "Tagebuch", icon: "table" },
    { id: "nutrition", label: "Ernährung", icon: "apple" },
    { id: "settings", label: "Einstellungen", icon: "settings" },
  ];


  return (
    <div style={{ background: COLORS.ink, minHeight: "100vh", color: COLORS.chalk, fontFamily: "'DM Sans', sans-serif" }}>
      <style>{`
        * { box-sizing: border-box; }
        .app-scale { font-family: 'DM Sans', sans-serif; }
        .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        input::placeholder { color: #6B7A75; }
        input, select { outline: none; }
        input:focus, select:focus { box-shadow: 0 0 0 2px ${COLORS.signal}; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: ${COLORS.line}; border-radius: 3px; }
        .tab-btn { transition: color 0.15s ease, background 0.15s ease; }
        .tab-scroll { -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none; }
        .tab-scroll::-webkit-scrollbar { display: none; }
        .row-hover:hover .del-btn { opacity: 1; }
        .del-btn { opacity: 0; transition: opacity 0.15s ease; }
        @media (prefers-reduced-motion: reduce) {
          * { transition: none !important; animation: none !important; }
        }
      `}</style>

      <div style={{ maxWidth: 480, margin: "0 auto", minHeight: "100vh", background: COLORS.ink, position: "relative", paddingBottom: 88 }}>
        {/* Calorie need questionnaire (first use / repeatable from Settings) */}
        {showQuestionnaire && (
          <CalorieQuestionnaire
            initial={profile}
            onComplete={completeQuestionnaire}
            onClose={() => setShowQuestionnaire(false)}
            allowClose={!!profile}
          />
        )}

        {/* Header */}
        <div style={{ padding: "28px 20px 16px" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
            <div>
              <div className="mono" style={{ fontSize: 11, color: COLORS.signal, letterSpacing: "0.15em", marginBottom: 4 }}>
                {new Date().toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "long" }).toUpperCase()}
              </div>
              <h1 className="display" style={{ fontSize: 40, margin: 0, lineHeight: 1 }}>REP<span style={{ color: COLORS.signal }}>.</span>LOG</h1>
            </div>
            <div style={{ textAlign: "right" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6, justifyContent: "flex-end" }}>
                <Icon name="flame" size={16} color={COLORS.ember} />
                <span className="mono" style={{ fontSize: 20, fontWeight: 700 }}>{streak}</span>
              </div>
              <div style={{ fontSize: 11, color: COLORS.steel, marginTop: 2 }}>Tage Streak</div>
            </div>
          </div>
        </div>

        {/* Stat strip */}
        {tab !== "home" && (
          <div style={{ display: "flex", gap: 10, padding: "0 20px 20px" }}>
            <StatCard label="Volumen (kg)" value={totalVolume.toLocaleString("de-DE")} accent={COLORS.signal} />
            <StatCard label="Kalorien heute" value={`${todaysKcal}`} accent={COLORS.ember} suffix={`/${kcalGoal}`} />
            <StatCard label="Sätze gesamt" value={logs.reduce((s, l) => s + l.sets, 0)} accent={COLORS.chalk} />
          </div>
        )}

        {/* Tabs -- horizontally swipe-scrollable so they never get squeezed on
            small screens; buttons use a fixed min-width instead of flex:1 so the
            row can actually overflow and scroll instead of just shrinking every
            label down. The scrollbar itself is hidden via the .tab-scroll CSS
            below so it doesn't visually clutter the row. */}
        <div className="tab-scroll" style={{ display: "flex", padding: "0 20px", gap: 4, marginBottom: 20, overflowX: "auto", overflowY: "hidden" }}>
          {tabs.map((t) => {
            const active = tab === t.id;
            return (
              <button
                key={t.id}
                onClick={() => setTab(t.id)}
                className="tab-btn"
                style={{
                  flex: "0 0 auto",
                  minWidth: 68,
                  display: "flex",
                  flexDirection: "column",
                  alignItems: "center",
                  gap: 4,
                  padding: "10px 6px",
                  borderRadius: 10,
                  border: "none",
                  cursor: "pointer",
                  background: active ? COLORS.card : "transparent",
                  color: active ? COLORS.signal : COLORS.steel,
                  whiteSpace: "nowrap",
                }}
              >
                <Icon name={t.icon} size={18} />
                <span style={{ fontSize: 10, fontWeight: 600, letterSpacing: "0.03em" }}>{t.label}</span>
              </button>
            );
          })}
        </div>

        <div style={{ padding: "0 20px" }}>
          {tab === "home" && (
            <HomeTab
              todaysKcal={todaysKcal}
              kcalGoal={kcalGoal}
              remainingKcal={remainingKcal}
              todayPlan={todayPlan}
              goal={goal}
              setGoal={setGoal}
              suggestions={suggestions}
              recipeCategory={recipeCategory}
              setRecipeCategory={setRecipeCategory}
              setTab={setTab}
              setForm={setForm}
              setActivePlan={setActivePlan}
              likedIngredients={likedIngredients}
              dislikedIngredients={dislikedIngredients}
              showPrefs={showPrefs}
              setShowPrefs={setShowPrefs}
              setLikedIngredients={setLikedIngredients}
              setDislikedIngredients={setDislikedIngredients}
            />
          )}
          {tab === "log" && (
            <LogTab form={form} setForm={setForm} addLog={addLog} logs={logs} removeLog={removeLog} />
          )}
          {tab === "training" && (
            <TrainingDiaryTab
              healthConnected={healthConnected}
              setHealthConnected={setHealthConnected}
              healthSource={healthSource}
              setHealthSource={setHealthSource}
              equipment={equipment}
              goal={goal}
              todayPlan={todayPlan}
              extraBurnTarget={extraBurnTarget}
            />
          )}
          {tab === "plans" && (
            <PlansTab setActivePlan={setActivePlan} setTab={setTab} setForm={setForm} equipment={equipment} goal={goal} />
          )}
          {tab === "progress" && (
            <ProgressTab
              progressData={progressData}
              setsPerExercise={setsPerExercise}
              logs={logs}
              weightLog={weightLog}
              addWeightEntry={addWeightEntry}
              removeWeightEntry={removeWeightEntry}
              profile={profile}
            />
          )}
          {tab === "diary" && (
            <DiaryTab
              dateKey={diaryDateKey}
              setDateKey={setDiaryDateKey}
              logs={logs}
              meals={meals}
              weightLog={weightLog}
              removeLog={removeLog}
              updateLog={updateLog}
              removeMeal={removeMeal}
              updateMeal={updateMeal}
              removeWeightEntry={removeWeightEntry}
              updateWeightEntry={updateWeightEntry}
              addLog={addLog}
              form={form}
              setForm={setForm}
              foodDatabase={foodDatabase}
              addWeightEntry={addWeightEntry}
            />
          )}
          {tab === "nutrition" && (
            <NutritionTab
              meals={todaysMeals}
              foodDatabase={foodDatabase}
              foodSearch={foodSearch}
              setFoodSearch={setFoodSearch}
              selectedFood={selectedFood}
              setSelectedFood={setSelectedFood}
              logAmount={logAmount}
              setLogAmount={setLogAmount}
              addMeal={addMeal}
              removeMeal={removeMeal}
              kcalGoal={kcalGoal}
              kcalPct={kcalPct}
              showAiScan={showAiScan}
              setShowAiScan={setShowAiScan}
              showLabelScan={showLabelScan}
              setShowLabelScan={setShowLabelScan}
              showBarcodeScan={showBarcodeScan}
              setShowBarcodeScan={setShowBarcodeScan}
              addCustomFood={addCustomFood}
              recognizeMealPhoto={recognizeMealPhoto}
              recognizeNutritionLabel={recognizeNutritionLabel}
              logRecognizedMeal={(recognized) =>
                setMeals((ms) => [
                  ...ms,
                  {
                    id: uid(), day: "Heute", foodId: null, name: recognized.name,
                    amount: null, unit: "Portion", kcal: recognized.kcal,
                    protein: recognized.protein, carbs: 0, sugar: 0, fat: 0,
                    satFat: 0, fiber: recognized.fiber, salt: 0,
                  },
                ])
              }
            />
          )}
          {tab === "settings" && (
            <SettingsTab
              profile={profile}
              kcalGoal={kcalGoal}
              onRepeatQuestionnaire={() => setShowQuestionnaire(true)}
              equipment={equipment}
              setEquipment={setEquipment}
              healthConnected={healthConnected}
              setHealthConnected={setHealthConnected}
              healthSource={healthSource}
              setHealthSource={setHealthSource}
              extraBurnTarget={extraBurnTarget}
              setExtraBurnTarget={setExtraBurnTarget}
            />
          )}
        </div>
      </div>
    </div>
  );
}

function StatCard({ label, value, accent, suffix }) {
  return (
    <div style={{ flex: 1, background: COLORS.card, borderRadius: 12, padding: "14px 12px", border: `1px solid ${COLORS.line}` }}>
      <div className="mono" style={{ fontSize: 20, fontWeight: 700, color: accent }}>
        {value}<span style={{ fontSize: 12, color: COLORS.steel }}>{suffix}</span>
      </div>
      <div style={{ fontSize: 10, color: COLORS.steel, marginTop: 4 }}>{label}</div>
    </div>
  );
}

function Field({ children }) {
  return <div style={{ flex: 1 }}>{children}</div>;
}

const inputStyle = {
  width: "100%",
  padding: "10px 12px",
  borderRadius: 8,
  border: `1px solid ${COLORS.line}`,
  background: COLORS.ink,
  color: COLORS.chalk,
  fontSize: 14,
};

function LogTab({ form, setForm, addLog, logs, removeLog }) {
  return (
    <div>
      <div style={{ background: COLORS.card, borderRadius: 14, padding: 16, border: `1px solid ${COLORS.line}`, marginBottom: 20 }}>
        <div style={{ fontSize: 12, color: COLORS.steel, marginBottom: 10, fontWeight: 600 }}>SATZ EINTRAGEN</div>
        <select
          value={form.exercise}
          onChange={(e) => setForm({ ...form, exercise: e.target.value })}
          style={{ ...inputStyle, marginBottom: 10 }}
        >
          {EXERCISE_LIBRARY.map((ex) => <option key={ex}>{ex}</option>)}
        </select>
        <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
          <Field><input placeholder="kg" type="number" value={form.weight} onChange={(e) => setForm({ ...form, weight: e.target.value })} style={inputStyle} /></Field>
          <Field><input placeholder="Wdh." type="number" value={form.reps} onChange={(e) => setForm({ ...form, reps: e.target.value })} style={inputStyle} /></Field>
          <Field><input placeholder="Sätze" type="number" value={form.sets} onChange={(e) => setForm({ ...form, sets: e.target.value })} style={inputStyle} /></Field>
        </div>
        <button
          onClick={addLog}
          style={{
            width: "100%", padding: "12px", borderRadius: 8, border: "none",
            background: COLORS.signal, color: COLORS.ink, fontWeight: 700, fontSize: 14,
            cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
          }}
        >
          <Icon name="plus" size={16} /> Satz speichern
        </button>
      </div>

      <div style={{ fontSize: 12, color: COLORS.steel, marginBottom: 10, fontWeight: 600 }}>HEUTIGES PROTOKOLL</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {logs.slice().reverse().map((l) => (
          <div key={l.id} className="row-hover" style={{
            display: "flex", justifyContent: "space-between", alignItems: "center",
            background: COLORS.card, borderRadius: 10, padding: "12px 14px", border: `1px solid ${COLORS.line}`,
          }}>
            <div>
              <div style={{ fontWeight: 600, fontSize: 14 }}>{l.exercise}</div>
              <div className="mono" style={{ fontSize: 12, color: COLORS.steel, marginTop: 2 }}>
                {l.sets} × {l.reps} @ {l.weight}kg
              </div>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontSize: 11, color: COLORS.steel }}>{l.date}</span>
              <button className="del-btn" onClick={() => removeLog(l.id)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.ember }}>
                <Icon name="trash" size={15} />
              </button>
            </div>
          </div>
        ))}
        {logs.length === 0 && <EmptyState text="Noch keine Sätze protokolliert. Trag deinen ersten Satz ein." />}
      </div>
    </div>
  );
}

function PlansTab({ setActivePlan, setTab, setForm, equipment, goal }) {
  const resolvedPlans = useMemo(() => PLANS.map((p) => resolvePlanForEquipment(p, equipment)), [equipment]);
  const [detailExercise, setDetailExercise] = useState(null);
  return (
    <div>
      <div style={{ fontSize: 12, color: COLORS.steel, marginBottom: 10, fontWeight: 600 }}>TRAININGSPLÄNE</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {resolvedPlans.map((p) => (
          <div key={p.id} style={{ background: COLORS.card, borderRadius: 14, padding: 16, border: `1px solid ${COLORS.line}` }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 10 }}>
              <div>
                <div style={{ fontWeight: 700, fontSize: 16 }}>{p.name}</div>
                <div style={{ fontSize: 12, color: COLORS.steel, marginTop: 2 }}>{p.focus}</div>
              </div>
              <Icon name="trophy" size={18} color={COLORS.signal} />
            </div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 12 }}>
              {p.exercises.map((ex) => (
                <button
                  key={ex}
                  onClick={() => setDetailExercise(ex)}
                  style={{ display: "flex", alignItems: "center", gap: 10, background: COLORS.ink, padding: "6px 10px 6px 6px", borderRadius: 8, border: "none", cursor: "pointer", textAlign: "left", width: "100%" }}
                >
                  <ExercisePictogram name={ex} size={34} />
                  <span className="mono" style={{ fontSize: 12, color: COLORS.chalk, flex: 1 }}>{ex}</span>
                  <Icon name="chevron" size={13} color={COLORS.steel} />
                </button>
              ))}
            </div>
            <button
              onClick={() => {
                setActivePlan(p.id);
                setForm((f) => ({ ...f, exercise: p.exercises[0] }));
                setTab("log");
              }}
              style={{
                width: "100%", padding: "10px", borderRadius: 8, border: `1px solid ${COLORS.signal}`,
                background: "transparent", color: COLORS.signal, fontWeight: 600, fontSize: 13,
                cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
              }}
            >
              Training starten <Icon name="chevron" size={14} />
            </button>
          </div>
        ))}
      </div>
      {detailExercise && <ExerciseDetailModal name={detailExercise} onClose={() => setDetailExercise(null)} goal={goal} />}
    </div>
  );
}

// ---------- Body composition: healthy reference ranges & gauge visualization ----------
// Reference ranges are simplified, commonly-cited orientation values (not medical advice)
// used only to color the gauge green ("im gesunden Bereich"), amber ("Grenzbereich") or
// red ("außerhalb"). Body-fat ranges depend on gender; the others are unisex approximations.
function healthyRanges(gender) {
  const bodyFat = gender === "weiblich" ? { low: 21, high: 33 } : { low: 10, high: 20 };
  return {
    fatPct: { ...bodyFat, unit: "%", label: "Körperfett" },
    musclePct: { low: gender === "weiblich" ? 30 : 33, high: gender === "weiblich" ? 40 : 46, unit: "%", label: "Muskelmasse" },
    waterPct: { low: 45, high: 60, unit: "%", label: "Wasser" },
    bonePct: { low: 2.5, high: 5.5, unit: "%", label: "Knochenmasse" },
  };
}

// Classifies a value against a healthy [low, high] range: "good" inside the range,
// "warn" just outside it (within a 15% margin of the range width), "bad" further off.
function rangeStatus(value, { low, high }) {
  if (value == null || Number.isNaN(value)) return "unknown";
  if (value >= low && value <= high) return "good";
  const margin = (high - low) * 0.3;
  if (value >= low - margin && value <= high + margin) return "warn";
  return "bad";
}

const STATUS_COLOR = { good: "#4FD8E8", warn: "#E8B84F", bad: "#E85F5F", unknown: "#5C6B7A" };
const STATUS_LABEL = { good: "Im gesunden Bereich", warn: "Grenzbereich", bad: "Außerhalb des gesunden Bereichs", unknown: "—" };

// A horizontal bar gauge: green/healthy zone in the middle, red zones at both ends,
// with a marker showing where the current value falls. Gives an at-a-glance read on
// whether a body-composition value is in a healthy range for the given metric.
function RangeGauge({ label, value, range, unit }) {
  const { low, high } = range;
  const span = high - low;
  // Visualize a window a bit wider than the healthy range so out-of-range values show up.
  const min = Math.max(0, low - span * 0.6);
  const max = high + span * 0.6;
  const pct = Math.min(100, Math.max(0, ((value - min) / (max - min)) * 100));
  const lowPct = ((low - min) / (max - min)) * 100;
  const highPct = ((high - min) / (max - min)) * 100;
  const status = rangeStatus(value, range);

  return (
    <div style={{ marginBottom: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 6 }}>
        <span style={{ fontSize: 12, fontWeight: 600, color: COLORS.chalk }}>{label}</span>
        <span className="mono" style={{ fontSize: 13, fontWeight: 700, color: STATUS_COLOR[status] }}>
          {value != null ? `${value}${unit}` : "—"}
        </span>
      </div>
      <div style={{ position: "relative", height: 10, borderRadius: 6, overflow: "hidden", background: "#E85F5F" }}>
        <div style={{ position: "absolute", left: `${lowPct}%`, width: `${Math.max(0, highPct - lowPct)}%`, top: 0, bottom: 0, background: "#4FD8E8" }} />
        <div style={{ position: "absolute", left: `${Math.max(0, lowPct - 8)}%`, width: 8, top: 0, bottom: 0, background: "#E8B84F", opacity: lowPct > 0 ? 1 : 0 }} />
        <div style={{ position: "absolute", left: `${Math.min(100, highPct)}%`, width: 8, top: 0, bottom: 0, background: "#E8B84F", opacity: highPct < 100 ? 1 : 0 }} />
        {value != null && (
          <div style={{ position: "absolute", left: `calc(${pct}% - 2px)`, top: -3, bottom: -3, width: 4, borderRadius: 2, background: COLORS.chalk, border: `1px solid ${COLORS.ink}` }} />
        )}
      </div>
      <div style={{ fontSize: 10, color: STATUS_COLOR[status], marginTop: 4 }}>{STATUS_LABEL[status]} ({low}–{high}{unit})</div>
    </div>
  );
}

function WeightEntryForm({ onAdd, lastWeight }) {

        <Field><QLabel text="Wasser (%)" /><input type="number" placeholder="optional" value={values.waterPct} onChange={(e) => setValues({ ...values, waterPct: e.target.value })} style={inputStyle} /></Field>

// ---------- Tagebuch (daily diary) ----------
// Lets Natalie browse any past day, see a condensed summary of everything logged
// that day (sets, meals, weight/composition), and edit or add entries retroactively —
// e.g. an evening meal she forgot to log at the time.
function DiaryTab({
  dateKey, setDateKey, logs, meals, weightLog,
  removeLog, updateLog, removeMeal, updateMeal,
  removeWeightEntry, updateWeightEntry,
  addLog, form, setForm, foodDatabase, addWeightEntry,
}) {
  const isToday = dateKey === isoDate();
  const dayLogs = logs.filter((l) => (l.dateKey || isoDate()) === dateKey);
  const dayMeals = meals.filter((m) => (m.dateKey || isoDate()) === dateKey);
  const dayWeight = weightLog.filter((w) => (w.dateKey || isoDate()) === dateKey);
  const dayKcal = dayMeals.reduce((s, m) => s + m.kcal, 0);
  const daySets = dayLogs.reduce((s, l) => s + l.sets, 0);

  const [editingMealId, setEditingMealId] = useState(null);
  const [editingLogId, setEditingLogId] = useState(null);
  const [showAddMeal, setShowAddMeal] = useState(false);
  const [showAddLog, setShowAddLog] = useState(false);
  const [showAddWeight, setShowAddWeight] = useState(false);

  const hasAnything = dayLogs.length > 0 || dayMeals.length > 0 || dayWeight.length > 0;

  return (
    <div>
      {/* Date navigator */}
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: COLORS.card, borderRadius: 14, padding: "12px 14px", border: `1px solid ${COLORS.line}`, marginBottom: 20 }}>
        <button onClick={() => setDateKey(addDaysToKey(dateKey, -1))} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.chalk, padding: 6 }}>
          <Icon name="chevron" size={18} color={COLORS.chalk} />
        </button>
        <div style={{ textAlign: "center" }}>
          <div className="mono" style={{ fontSize: 14, fontWeight: 700 }}>{labelForDateKey(dateKey)}</div>
          {isToday && <div style={{ fontSize: 10, color: COLORS.signal, marginTop: 2 }}>HEUTE</div>}
        </div>
        <button
          onClick={() => !isToday && setDateKey(addDaysToKey(dateKey, 1))}
          disabled={isToday}
          style={{ background: "none", border: "none", cursor: isToday ? "not-allowed" : "pointer", opacity: isToday ? 0.3 : 1, padding: 6, transform: "rotate(180deg)" }}
        >
          <Icon name="chevron" size={18} color={COLORS.chalk} />
        </button>
      </div>

      {/* Condensed summary */}
      <div style={{ display: "flex", gap: 10, marginBottom: 20 }}>
        <StatCard label="Kalorien" value={`${dayKcal}`} accent={COLORS.ember} />
        <StatCard label="Sätze" value={daySets} accent={COLORS.signal} />
        <StatCard label="Gewicht" value={dayWeight.length ? `${dayWeight[dayWeight.length - 1].weightKg}kg` : "—"} accent={COLORS.chalk} />
      </div>

      {!hasAnything && (
        <EmptyState text="Für diesen Tag wurde noch nichts erfasst. Trage unten etwas nach." />
      )}

      {/* Training sets that day */}
      {dayLogs.length > 0 && (
        <div style={{ marginBottom: 20 }}>
          <div style={{ fontSize: 12, color: COLORS.steel, marginBottom: 10, fontWeight: 600 }}>TRAINING</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {dayLogs.map((l) =>
              editingLogId === l.id ? (
                <EditLogRow key={l.id} log={l} onSave={(patch) => { updateLog(l.id, patch); setEditingLogId(null); }} onCancel={() => setEditingLogId(null)} />
              ) : (
                <div key={l.id} className="row-hover" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: COLORS.card, borderRadius: 10, padding: "10px 12px", border: `1px solid ${COLORS.line}` }}>
                  <div>
                    <div style={{ fontWeight: 600, fontSize: 13 }}>{l.exercise}</div>
                    <div className="mono" style={{ fontSize: 11, color: COLORS.steel }}>{l.weight}kg × {l.reps} × {l.sets} Sätze</div>
                  </div>
                  <div style={{ display: "flex", gap: 4 }}>
                    <button onClick={() => setEditingLogId(l.id)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.steel, padding: 4 }}>
                      <Icon name="tool" size={14} />
                    </button>
                    <button onClick={() => removeLog(l.id)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.steel, padding: 4 }}>
                      <Icon name="trash" size={14} />
                    </button>
                  </div>
                </div>
              )
            )}
          </div>
        </div>
      )}

      {/* Meals that day */}
      {dayMeals.length > 0 && (
        <div style={{ marginBottom: 20 }}>
          <div style={{ fontSize: 12, color: COLORS.steel, marginBottom: 10, fontWeight: 600 }}>ERNÄHRUNG</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {dayMeals.map((m) =>
              editingMealId === m.id ? (
                <EditMealRow key={m.id} meal={m} onSave={(patch) => { updateMeal(m.id, patch); setEditingMealId(null); }} onCancel={() => setEditingMealId(null)} />
              ) : (
                <div key={m.id} className="row-hover" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: COLORS.card, borderRadius: 10, padding: "10px 12px", border: `1px solid ${COLORS.line}` }}>
                  <div>
                    <div style={{ fontWeight: 600, fontSize: 13 }}>{m.name}</div>
                    {m.amount != null && <span className="mono" style={{ fontSize: 11, color: COLORS.steel }}>{m.amount}{m.unit}</span>}
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span className="mono" style={{ fontSize: 12, color: COLORS.ember }}>{m.kcal} kcal</span>
                    <button onClick={() => setEditingMealId(m.id)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.steel, padding: 4 }}>
                      <Icon name="tool" size={14} />
                    </button>
                    <button onClick={() => removeMeal(m.id)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.steel, padding: 4 }}>
                      <Icon name="trash" size={14} />
                    </button>
                  </div>
                </div>
              )
            )}
          </div>
        </div>
      )}

      {/* Weight/composition that day */}
      {dayWeight.length > 0 && (
        <div style={{ marginBottom: 20 }}>
          <div style={{ fontSize: 12, color: COLORS.steel, marginBottom: 10, fontWeight: 600 }}>KÖRPERWERTE</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {dayWeight.map((w) => (
              <div key={w.id} className="row-hover" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: COLORS.card, borderRadius: 10, padding: "10px 12px", border: `1px solid ${COLORS.line}` }}>
                <div style={{ fontWeight: 600, fontSize: 13 }}>{w.weightKg} kg</div>
                <button onClick={() => removeWeightEntry(w.id)} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.steel, padding: 4 }}>
                  <Icon name="trash" size={14} />
                </button>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Nachträglich hinzufügen — add forgotten entries for this day */}
      <div style={{ fontSize: 12, color: COLORS.steel, marginBottom: 10, fontWeight: 600 }}>NACHTRAG FÜR DIESEN TAG</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        <DiaryAddMealForm
          open={showAddMeal}
          setOpen={setShowAddMeal}
          foodDatabase={foodDatabase}
          onAdd={(entry) => {
            // Reuses the same shape as addMeal, but targets this diary day.
            const scaled = scaleFood(entry.food, entry.amount);
            updateMeal; // no-op reference to satisfy linters in some bundlers
            setShowAddMeal(false);
            entry.onCreate({
              id: uid(),
              day: isToday ? "Heute" : labelForDateKey(dateKey),
              dateKey,
              foodId: entry.food.id,
              name: entry.food.name,
              amount: scaled.amount,
              unit: entry.food.unit,
              kcal: scaled.kcal,
              protein: scaled.protein,
              carbs: scaled.carbs,
              sugar: scaled.sugar,
              fat: scaled.fat,
              satFat: scaled.satFat,
              fiber: scaled.fiber,
              salt: scaled.salt,
            });
          }}
        />
        <DiaryAddLogForm
          open={showAddLog}
          setOpen={setShowAddLog}
          onAdd={(entry) => addLog(dateKey, entry)}
          dateKey={dateKey}
        />
        <DiaryAddWeightForm
          open={showAddWeight}
          setOpen={setShowAddWeight}
          onAdd={(values) => addWeightEntry(values, dateKey)}
        />
      </div>
    </div>
  );
}

// Live camera barcode scanner: uses getUserMedia for the rear camera and, where
// supported (Chrome/Android), the native BarcodeDetector API to read the code
// directly from the video stream — no photo capture, no simulation. Falls back
// to manual code entry if the camera or BarcodeDetector isn't available.
function LiveBarcodeScanner({ onDetected }) {
  const videoRef = React.useRef(null);
  const streamRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const zxingReaderRef = React.useRef(null);
  const zxingControlsRef = React.useRef(null);
  const [status, setStatus] = useState("starting"); // starting | scanning | unsupported | denied | error
  const [manualCode, setManualCode] = useState("");

  React.useEffect(() => {
    let cancelled = false;

    // Loads the ZXing UMD bundle from a CDN on demand -- only needed as a
    // fallback when the native BarcodeDetector API isn't available, which is
    // the case on most Android Chrome builds and all of iOS Safari/Firefox.
    // Cached on window after the first successful load.
    function loadZXing() {
      if (window.ZXing) return Promise.resolve(window.ZXing);
      if (window.__zxingLoadPromise) return window.__zxingLoadPromise;
      window.__zxingLoadPromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js";
        script.async = true;
        script.onload = () => resolve(window.ZXing);
        script.onerror = () => reject(new Error("ZXing konnte nicht geladen werden"));
        document.head.appendChild(script);
      });
      return window.__zxingLoadPromise;
    }

    // ZXing fallback: decodes barcodes directly from the already-running video
    // stream, frame by frame, via its own internal loop (decodeFromStream).
    async function startZXingFallback() {
      try {
        const ZXing = await loadZXing();
        if (cancelled) return;
        const reader = new ZXing.BrowserMultiFormatReader();
        zxingReaderRef.current = reader;
        setStatus("scanning");
        const controls = await reader.decodeFromStream(streamRef.current, videoRef.current, (result, err) => {
          if (cancelled) return;
          if (result) {
            onDetected(result.getText());
          }
          // A NotFoundException fires continuously while no code is in view --
          // that's expected and should not change the status or stop scanning.
        });
        zxingControlsRef.current = controls;
      } catch (e) {
        if (!cancelled) setStatus("error");
      }
    }

    async function start() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setStatus("unsupported");
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false,
        });
        if (cancelled) { stream.getTracks().forEach((t) => t.stop()); return; }
        streamRef.current = stream;
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          await videoRef.current.play();
        }
        setStatus("scanning");

        if (!("BarcodeDetector" in window)) {
          // Most common case on Android Chrome (BarcodeDetector isn't
          // installed there) and on all non-Chromium browsers -- fall back to
          // ZXing instead of giving up and asking for manual entry.
          await startZXingFallback();
          return;
        }
        const detector = new window.BarcodeDetector({
          formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "qr_code"],
        });

        const tick = async () => {
          if (cancelled || !videoRef.current || videoRef.current.readyState < 2) {
            rafRef.current = requestAnimationFrame(tick);
            return;
          }
          try {
            const codes = await detector.detect(videoRef.current);
            if (codes && codes.length > 0) {
              onDetected(codes[0].rawValue);
              return; // stop the loop, parent will unmount this component
            }
          } catch (e) {
            // Detection hiccup on a single frame -- keep trying. If the native
            // detector is present but fundamentally broken on this device, fall
            // back to ZXing instead of silently looping forever.
            if (e && e.name === "NotSupportedError") {
              await startZXingFallback();
              return;
            }
          }
          rafRef.current = requestAnimationFrame(tick);
        };
        rafRef.current = requestAnimationFrame(tick);
      } catch (err) {
        setStatus(err && err.name === "NotAllowedError" ? "denied" : "error");
      }
    }

    start();
    return () => {
      cancelled = true;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      if (zxingControlsRef.current) zxingControlsRef.current.stop();
      if (zxingReaderRef.current && zxingReaderRef.current.reset) zxingReaderRef.current.reset();
      if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop());
    };
  }, [onDetected]);

  const submitManual = () => {
    if (manualCode.trim()) onDetected(manualCode.trim());
  };

  return (
    <div>
      <div style={{
        position: "relative", aspectRatio: "4 / 3", background: "#000", borderRadius: 12,
        border: `1px solid ${COLORS.line}`, overflow: "hidden", marginBottom: 14,
      }}>
        <video ref={videoRef} muted playsInline style={{ width: "100%", height: "100%", objectFit: "cover", display: status === "scanning" || status === "unsupported" ? "block" : "none" }} />
        {status === "scanning" && (
          <div style={{ position: "absolute", inset: "20% 10%", border: `2px solid ${COLORS.signal}`, borderRadius: 8, pointerEvents: "none" }} />
        )}
        {status === "starting" && (
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", color: COLORS.steel, fontSize: 12 }}>Kamera wird gestartet…</div>
        )}
        {status === "denied" && (
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", textAlign: "center", padding: 16, color: COLORS.steel, fontSize: 12 }}>
            Kamerazugriff wurde verweigert. Erlaube den Zugriff in den Browser-Einstellungen oder gib den Code manuell ein.
          </div>
        )}
        {status === "error" && (
          <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", textAlign: "center", padding: 16, color: COLORS.steel, fontSize: 12 }}>
            Kamera konnte nicht gestartet werden. Gib den Code manuell ein.
          </div>
        )}
      </div>

      {status === "unsupported" && (
        <div style={{ fontSize: 11, color: COLORS.steel, marginBottom: 10 }}>
          Automatische Erkennung wird von diesem Browser nicht unterstützt. Gib den Code unten manuell ein.
        </div>
      )}

      <div style={{ display: "flex", gap: 8 }}>
        <input
          placeholder="Barcode manuell eingeben"
          value={manualCode}
          onChange={(e) => setManualCode(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") submitManual(); }}
          style={{ ...inputStyle, flex: 1 }}
        />
        <button
          onClick={submitManual}
          disabled={!manualCode.trim()}
          style={{
            padding: "0 16px", borderRadius: 8, border: "none",
            background: manualCode.trim() ? COLORS.signal : COLORS.line,
            color: manualCode.trim() ? COLORS.ink : COLORS.steel,
            fontWeight: 700, fontSize: 13, cursor: manualCode.trim() ? "pointer" : "not-allowed",
          }}
        >
          OK
        </button>
      </div>
    </div>
  );
}

function BarcodeScanModal({ onClose, onFound, onCreateNew, recognize }) {
  const [scanned, setScanned] = useState(false);
  const [code, setCode] = useState(null);
  const [match, setMatch] = useState(undefined); // undefined = not scanned, null = not found, object = found

  const handleDetected = React.useCallback((value) => {
    setScanned(true);
    setCode(value);
    setMatch(lookupBarcode(value));
  }, []);

  if (!scanned) {
    return (
      <ScanModalShell title="BARCODE SCANNEN" subtitle="Halte den Barcode einer Zutat vor die Kamera — die Erkennung läuft automatisch." onClose={onClose}>
        <LiveBarcodeScanner onDetected={handleDetected} />
      </ScanModalShell>
    );
  }

  if (match === undefined) {
    return (
      <ScanModalShell title="BARCODE SCANNEN" onClose={onClose}>
        <div style={{ textAlign: "center", padding: "24px 0", color: COLORS.steel, fontSize: 13 }}>Scanne…</div>
      </ScanModalShell>
    );
  }

  if (match) {
    return (
      <ScanModalShell title="ZUTAT GEFUNDEN" onClose={onClose}>
        <div style={{ background: COLORS.ink, borderRadius: 10, padding: 12, border: `1px solid ${COLORS.line}`, marginBottom: 14 }}>
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 4 }}>{match.name}</div>
          <span className="mono" style={{ fontSize: 12, color: COLORS.ember }}>{match.kcal} kcal / 100{match.unit}</span>
        </div>
        <button
          onClick={() => onFound(match)}
          style={{ width: "100%", padding: "12px", borderRadius: 8, border: "none", background: COLORS.signal, color: COLORS.ink, fontWeight: 700, fontSize: 14, cursor: "pointer" }}
        >
          Menge erfassen
        </button>
      </ScanModalShell>
    );
  }

  return (
    <BarcodeNotFoundForm code={code} onClose={onClose} onCreateNew={onCreateNew} recognize={recognize} />
  );
}

        <Field><QLabel text="Ballaststoffe (g)" /><input type="number" value={values.fiber} onChange={(e) => setValues({ ...values, fiber: e.target.value })} style={inputStyle} /></Field>
        <Field><QLabel text="Salz (g)" /><input type="number" value={values.salt} onChange={(e) => setValues({ ...values, salt: e.target.value })} style={inputStyle} /></Field>
      </div>
      <button

        disabled={!isValid}
        style={{
          width: "100%", padding: "12px", borderRadius: 8, border: "none",

          fontWeight: 700, fontSize: 14, cursor: isValid ? "pointer" : "not-allowed",
        }}
      >
        Zutat speichern & übernehmen
      </button>
      {showLabelScan && (
        <LabelScanModal
          onClose={() => setShowLabelScan(false)}
          recognize={recognize}
          onSave={(food) => {
            setValues({
              kcal: String(food.kcal ?? ""), protein: String(food.protein ?? ""),
              carbs: String(food.carbs ?? ""), sugar: String(food.sugar ?? ""),
              fat: String(food.fat ?? ""), satFat: String(food.satFat ?? ""),
              fiber: String(food.fiber ?? ""), salt: String(food.salt ?? ""),
            });
            if (food.unit) setUnit(food.unit);
            if (food.name && !name.trim()) setName(food.name);
            setShowLabelScan(false);
          }}
        />
      )}
    </ScanModalShell>
  );
}

// Scales a food's per-100 values to the actually logged amount.
function scaleFood(food, amount) {
  const factor = amount / 100;
  const scaled = { ...food, amount };
  ["kcal", "protein", "carbs", "sugar", "fat", "satFat", "fiber", "salt"].forEach((k) => {
    scaled[k] = Math.round((food[k] ?? 0) * factor * 10) / 10;
  });
  return scaled;
}

// Mocked barcode lookup: in a real build this would call an open food database API.
function lookupBarcode(code) {
  return FOOD_DATABASE.find((f) => f.barcode === code) || null;
}

                </span>
                <span className="mono" style={{ fontSize: 10, color: COLORS.steel }}>{surprise.protein}g Protein · {surprise.fiber}g Ballaststoffe</span>

function CalorieQuestionnaire({ initial, onComplete, onClose, allowClose }) {
  const [answers, setAnswers] = useState(
    initial || { gender: "männlich", age: "", heightCm: "", weightKg: "", activityLevel: "leicht", goal: "definieren" }
  );

  const isValid = answers.age && answers.heightCm && answers.weightKg;

  const submit = () => {
    if (!isValid) return;
    onComplete({
      gender: answers.gender,
      age: Number(answers.age),
      heightCm: Number(answers.heightCm),
      weightKg: Number(answers.weightKg),
      activityLevel: answers.activityLevel,
      goal: answers.goal,
    });
  };

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", zIndex: 60, display: "flex", alignItems: "center", justifyContent: "center", padding: 16 }}>
      <div style={{ background: COLORS.card, borderRadius: 18, border: `1px solid ${COLORS.line}`, padding: 22, width: "100%", maxWidth: 440, maxHeight: "88vh", overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 4 }}>
          <div>
            <div style={{ fontSize: 12, color: COLORS.signal, fontWeight: 600, letterSpacing: "0.08em" }}>KALORIENBEDARF</div>
            <div style={{ fontWeight: 700, fontSize: 19, marginTop: 2 }}>Kurzer Fragebogen</div>
          </div>
          {allowClose && (
            <button onClick={onClose} style={{ background: "none", border: "none", cursor: "pointer", color: COLORS.steel }}>
              <Icon name="close" size={18} />
            </button>
          )}
        </div>
        <div style={{ fontSize: 12, color: COLORS.steel, marginBottom: 18 }}>
          Damit berechnen wir deinen individuellen Tagesbedarf an Kalorien. Du kannst das jederzeit in den Einstellungen wiederholen.
        </div>

        <QLabel text="Geschlecht" />
        <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
          {["männlich", "weiblich"].map((g) => (
            <ChoiceButton key={g} active={answers.gender === g} onClick={() => setAnswers({ ...answers, gender: g })} label={g === "männlich" ? "Männlich" : "Weiblich"} />
          ))}
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
          <Field>
            <QLabel text="Alter" />
            <input type="number" placeholder="Jahre" value={answers.age} onChange={(e) => setAnswers({ ...answers, age: e.target.value })} style={inputStyle} />
          </Field>
          <Field>
            <QLabel text="Größe" />
            <input type="number" placeholder="cm" value={answers.heightCm} onChange={(e) => setAnswers({ ...answers, heightCm: e.target.value })} style={inputStyle} />
          </Field>
          <Field>
            <QLabel text="Gewicht" />
            <input type="number" placeholder="kg" value={answers.weightKg} onChange={(e) => setAnswers({ ...answers, weightKg: e.target.value })} style={inputStyle} />
          </Field>
        </div>

        <QLabel text="Aktivitätslevel" />
        <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 14 }}>
          {ACTIVITY_LEVELS.map((a) => (
            <button
              key={a.id}
              onClick={() => setAnswers({ ...answers, activityLevel: a.id })}
              style={{
                textAlign: "left", padding: "10px 12px", borderRadius: 10, cursor: "pointer",
                border: `1px solid ${answers.activityLevel === a.id ? COLORS.signal : COLORS.line}`,
                background: answers.activityLevel === a.id ? "rgba(200,255,77,0.08)" : COLORS.ink,
              }}
            >
              <div style={{ fontSize: 13, fontWeight: 600, color: answers.activityLevel === a.id ? COLORS.signal : COLORS.chalk }}>{a.label}</div>
              <div style={{ fontSize: 11, color: COLORS.steel }}>{a.desc}</div>
            </button>
          ))}
        </div>

        <QLabel text="Ziel" />
        <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
          {GOALS.map((g) => (
            <ChoiceButton key={g.id} active={answers.goal === g.id} onClick={() => setAnswers({ ...answers, goal: g.id })} label={g.label} />
          ))}
        </div>

        <button
          onClick={submit}
          disabled={!isValid}
          style={{
            width: "100%", padding: "13px", borderRadius: 10, border: "none",
            background: isValid ? COLORS.signal : COLORS.line, color: isValid ? COLORS.ink : COLORS.steel,
            fontWeight: 700, fontSize: 14, cursor: isValid ? "pointer" : "not-allowed",
          }}
        >
          Kalorienbedarf berechnen
        </button>
      </div>
    </div>
  );
}
