function TrainingDiaryTab({ healthConnected, setHealthConnected, healthSource, setHealthSource, equipment, goal, todayPlan, extraBurnTarget }) {

  const dayFocus = DAILY_STIMULUS_FOCUS[todayIndex];

  const supplements = useMemo(
    () => suggestTrainingSupplement({
      burnedSoFar: burnedSoFar + (plannedWorkout?.estimatedKcal ?? 0),
      targetBurn,
      equipment,
      goal,
      hasStrengthPlanToday: !!todayPlan,
      dayFocus,

    <div>
      {/* Health Connect card */}

          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>

              <Icon name="check" size={12} /> Verbunden

          )}

          <div>
            <div style={{ fontSize: 12, color: COLORS.steel, marginBottom: 12 }}>

            </div>
            <select value={healthSource} onChange={(e) => setHealthSource(e.target.value)} style={{ ...inputStyle, marginBottom: 10 }}>
              {HEALTH_CONNECT_SOURCES.map((s) => <option key={s}>{s}</option>)}
            </select>
            <button
              onClick={() => setHealthConnected(true)}
              style={{
                width: "100%", padding: "12px", borderRadius: 8, border: "none",
                background: COLORS.signal, color: COLORS.ink, fontWeight: 700, fontSize: 14,
                cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
              }}
            >
              <Icon name="link" size={15} /> Mit {healthSource} verbinden

          </div>
        ) : (
          <div>
            <div style={{ fontSize: 11, color: COLORS.steel, marginBottom: 10 }}>Synchronisiert mit {healthSource}</div>
            {MOCK_HEALTH_CONNECT_DATA.todayActivities.map((a) => (
              <div key={a.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: COLORS.ink, borderRadius: 10, padding: "10px 12px", marginBottom: 8, border: `1px solid ${COLORS.line}` }}>
                <div>
                  <div style={{ fontWeight: 600, fontSize: 13 }}>{a.name}</div>
                  <div className="mono" style={{ fontSize: 11, color: COLORS.steel }}>{a.durationMin} min</div>
                </div>
                <span className="mono" style={{ fontSize: 13, color: COLORS.ember }}>{a.kcal} kcal</span>
              </div>
            ))}
            {plannedWorkout && (
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: COLORS.ink, borderRadius: 10, padding: "10px 12px", border: `1px dashed ${COLORS.line}` }}>

                  <div style={{ fontWeight: 600, fontSize: 13 }}>{plannedWorkout.name}</div>

          <Icon name="sparkles" size={16} color={COLORS.signal} />

              >
                <ExercisePictogram name={s.name} size={40} />
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 4 }}>
                    <div style={{ fontWeight: 700, fontSize: 14 }}>{s.name}</div>
                    <span className="mono" style={{ fontSize: 12, color: COLORS.ember, whiteSpace: "nowrap", marginLeft: 8 }}>~{s.kcal} kcal</span>
                  </div>
                  <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 6, flexWrap: "wrap" }}>

                </div>
                <Icon name="chevron" size={13} color={COLORS.steel} />
              </div>
            ))}
          </div>
        )}
      </div>

      {detailExercise && <ExerciseDetailModal name={detailExercise} onClose={() => setDetailExercise(null)} goal={goal} />}
    </div>
  );
}

function SettingsTab({ profile, kcalGoal, onRepeatQuestionnaire, equipment, setEquipment, healthConnected, setHealthConnected, healthSource, setHealthSource, extraBurnTarget, setExtraBurnTarget }) {
  const toggleEquipment = (item) => {
    setEquipment(equipment.includes(item) ? equipment.filter((e) => e !== item) : [...equipment, item]);
  };
  const [burnInput, setBurnInput] = useState(String(extraBurnTarget));
  React.useEffect(() => setBurnInput(String(extraBurnTarget)), [extraBurnTarget]);
  const commitBurnTarget = () => {
    const n = Math.max(0, Math.round(Number(burnInput)));
    if (Number.isFinite(n) && n > 0) setExtraBurnTarget(n);
    else setBurnInput(String(extraBurnTarget));
  };

  return (
    <div>
      {/* Calorie profile */}
      <div style={{ background: COLORS.card, borderRadius: 16, padding: 18, border: `1px solid ${COLORS.line}`, marginBottom: 16 }}>
        <div style={{ fontSize: 12, color: COLORS.steel, fontWeight: 600, marginBottom: 12 }}>KALORIENPROFIL</div>
        {profile ? (
          <div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 14 }}>
            <ProfileRow label="Geschlecht" value={profile.gender === "männlich" ? "Männlich" : "Weiblich"} />
            <ProfileRow label="Alter" value={`${profile.age} Jahre`} />
            <ProfileRow label="Größe" value={`${profile.heightCm} cm`} />
            <ProfileRow label="Gewicht" value={`${profile.weightKg} kg`} />
            <ProfileRow label="Aktivität" value={ACTIVITY_LEVELS.find((a) => a.id === profile.activityLevel)?.label} />
            <ProfileRow label="Ziel" value={GOALS.find((g) => g.id === profile.goal)?.label} />
            <ProfileRow label="Tagesbedarf" value={`${kcalGoal} kcal`} accent />
          </div>
        ) : (
          <div style={{ fontSize: 12, color: COLORS.steel, marginBottom: 14 }}>Noch kein Profil angelegt. Es wird der Standardwert von {kcalGoal} kcal verwendet.</div>
        )}
        <button
          onClick={onRepeatQuestionnaire}
          style={{
            width: "100%", padding: "12px", borderRadius: 8, border: `1px solid ${COLORS.signal}`,
            background: "transparent", color: COLORS.signal, fontWeight: 600, fontSize: 13, cursor: "pointer",
          }}
        >
          Fragebogen erneut ausfüllen
        </button>
      </div>

      {/* Extra activity-burn target for the KI-Trainingsergänzung */}
      <div style={{ background: COLORS.card, borderRadius: 16, padding: 18, border: `1px solid ${COLORS.line}`, marginBottom: 16 }}>
        <div style={{ fontSize: 12, color: COLORS.steel, fontWeight: 600, marginBottom: 6 }}>ZUSATZ-VERBRENNUNGSZIEL</div>
        <div style={{ fontSize: 11, color: COLORS.steel, marginBottom: 12 }}>
          Wie viele kcal möchtest du zusätzlich zu deinem täglichen Kalorienpensum durch Training verbrennen? Die KI-Trainingsergänzung richtet ihre Vorschläge danach aus.
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          <input
            type="number"
            min="0"
            step="10"
            value={burnInput}
            onChange={(e) => setBurnInput(e.target.value)}
            onBlur={commitBurnTarget}
            onKeyDown={(e) => { if (e.key === "Enter") { commitBurnTarget(); e.currentTarget.blur(); } }}
            style={{ ...inputStyle, flex: 1 }}
          />
          <span className="mono" style={{ fontSize: 13, color: COLORS.steel }}>kcal / Tag</span>
        </div>
      </div>

      {/* Health Connect */}
      <div style={{ background: COLORS.card, borderRadius: 16, padding: 18, border: `1px solid ${COLORS.line}`, marginBottom: 16 }}>
        <div style={{ fontSize: 12, color: COLORS.steel, fontWeight: 600, marginBottom: 12 }}>HEALTH CONNECT</div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <div>
            <div style={{ fontSize: 13, fontWeight: 600 }}>{healthConnected ? `Verbunden mit ${healthSource}` : "Nicht verbunden"}</div>
            <div style={{ fontSize: 11, color: COLORS.steel, marginTop: 2 }}>Polar Flow und weitere kompatible Apps</div>
          </div>
          <button
            onClick={() => setHealthConnected(!healthConnected)}
            style={{
              padding: "8px 14px", borderRadius: 8, fontSize: 12, fontWeight: 600, cursor: "pointer",
              border: `1px solid ${healthConnected ? COLORS.ember : COLORS.signal}`,
              background: "transparent", color: healthConnected ? COLORS.ember : COLORS.signal,
            }}
          >
            {healthConnected ? "Trennen" : "Verbinden"}
          </button>
        </div>
      </div>

      {/* Equipment */}
      <div style={{ background: COLORS.card, borderRadius: 16, padding: 18, border: `1px solid ${COLORS.line}` }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
          <Icon name="tool" size={14} color={COLORS.steel} />
          <div style={{ fontSize: 12, color: COLORS.steel, fontWeight: 600 }}>VERFÜGBARE GERÄTE</div>
        </div>
        <div style={{ fontSize: 11, color: COLORS.steel, marginBottom: 12 }}>
          Wird für die KI-Trainingsergänzung genutzt, damit nur passende Übungen vorgeschlagen werden.
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {EQUIPMENT_LIBRARY.map((item) => {
            const active = equipment.includes(item);
            return (
              <button
                key={item}
                onClick={() => toggleEquipment(item)}
                style={{
                  padding: "8px 12px", borderRadius: 999, fontSize: 12, fontWeight: 600, cursor: "pointer",
                  border: `1px solid ${active ? COLORS.signal : COLORS.line}`,
                  background: active ? COLORS.signal : "transparent",
                  color: active ? COLORS.ink : COLORS.steel,
                }}
              >
                {item}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function ProfileRow({ label, value, accent }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13 }}>
      <span style={{ color: COLORS.steel }}>{label}</span>
      <span className="mono" style={{ fontWeight: 600, color: accent ? COLORS.signal : COLORS.chalk }}>{value}</span>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
